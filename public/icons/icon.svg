<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a9c6a"/>
      <stop offset="100%" style="stop-color:#4a7c59"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bgGrad)"/>
  
  <!-- Border accent -->
  <rect x="16" y="16" width="480" height="480" rx="64" fill="none" stroke="#4a7c59" stroke-width="4" opacity="0.5"/>
  
  <!-- Drum pad grid (2x2) -->
  <!-- Top left -->
  <rect x="80" y="100" width="150" height="130" rx="16" fill="#252525"/>
  <rect x="80" y="100" width="150" height="130" rx="16" fill="none" stroke="#4a7c59" stroke-width="2"/>
  
  <!-- Top right -->
  <rect x="282" y="100" width="150" height="130" rx="16" fill="#252525"/>
  <rect x="282" y="100" width="150" height="130" rx="16" fill="none" stroke="#3a5c45" stroke-width="2"/>
  
  <!-- Bottom left -->
  <rect x="80" y="280" width="150" height="130" rx="16" fill="#252525"/>
  <rect x="80" y="280" width="150" height="130" rx="16" fill="none" stroke="#3a5c45" stroke-width="2"/>
  
  <!-- Bottom right (highlighted) -->
  <rect x="282" y="280" width="150" height="130" rx="16" fill="url(#accentGrad)" opacity="0.8"/>
  <rect x="282" y="280" width="150" height="130" rx="16" fill="none" stroke="#5a9c6a" stroke-width="3"/>
  
  <!-- Waveform on highlighted pad -->
  <path d="M302 345 Q320 320 340 345 Q360 370 380 345 Q400 320 412 345" 
        fill="none" stroke="#e8e8e8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Text: DR-101 -->
  <text x="256" y="460" font-family="monospace" font-size="48" font-weight="bold" 
        fill="#4a7c59" text-anchor="middle" letter-spacing="4">DR-101</text>
</svg>
