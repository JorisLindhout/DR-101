<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0GDRVK9GGQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-0GDRVK9GGQ');
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="description" content="DR-101: An interactive drum synthesizer for learning audio synthesis fundamentals" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="DR-101" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>DR-101 | Drum Synthesizer</title>
    <meta name="author" content="Joris Lindhout">
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="logo">
          <span class="logo-text">DR-101</span>
          <span class="logo-subtitle">DRUM SYNTHESIZER</span>
        </div>
        <div class="logo-image">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4M12 8h.01"/>
          </svg>
        </div>
      </header>

      <main class="main">
        <section class="sound-selector">
          <button class="sound-tab active" data-sound="kick">KICK</button>
          <button class="sound-tab" data-sound="snare">SNARE</button>
          <button class="sound-tab" data-sound="hihat-closed">CH</button>
          <button class="sound-tab" data-sound="hihat-open">OH</button>
          <button class="sound-tab" data-sound="tom">TOM</button>
        </section>

        <section class="visualizer-section">
          <canvas id="waveformCanvas" class="waveform-display"></canvas>
          <canvas id="envelopeCanvas" class="envelope-display"></canvas>
        </section>

        <section class="controls-section" id="controlsSection">
          <!-- Controls are dynamically generated based on selected sound -->
        </section>

        <section class="play-section">
          <button class="play-button" id="playButton">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5,3 19,12 5,21"/>
            </svg>
          </button>
          <div class="preset-controls">
            <select id="presetSelect" class="preset-select">
              <option value="">-- Presets --</option>
            </select>
            <button class="preset-btn" id="savePreset" title="Save preset">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
              </svg>
            </button>
          </div>
        </section>

        <section class="sequencer-section" id="sequencerSection">
          <div class="sequencer-header">
            <h3 class="sequencer-title">SEQUENCER</h3>
            <div class="sequencer-controls">
              <label class="tempo-control">
                <span>BPM</span>
                <input type="number" id="tempoInput" value="120" min="40" max="300" />
              </label>
              <button class="seq-btn" id="seqPlayBtn" title="Play/Stop">
                <svg class="play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5,3 19,12 5,21"/>
                </svg>
                <svg class="stop-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                  <rect x="4" y="4" width="16" height="16"/>
                </svg>
              </button>
              <button class="seq-btn" id="seqClearBtn" title="Clear pattern">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="sequencer-grid" id="sequencerGrid">
            <!-- Grid generated by JS -->
          </div>
        </section>
      </main>

      <div class="info-panel" id="infoPanel">
        <div class="info-panel-header">
          <h3 id="infoPanelTitle">Learning Mode</h3>
          <button class="info-panel-close" id="infoPanelClose">&times;</button>
        </div>
        <div class="info-panel-content" id="infoPanelContent">
          <p>Click on any <span class="info-icon-inline">ⓘ</span> icon next to a parameter to learn about audio synthesis concepts.</p>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
